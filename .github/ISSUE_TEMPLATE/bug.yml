name: Bug report
description: Something in litany doesn't work.
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
      description: A few lines. Steps to reproduce if you have them.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Claude Code version
      description: Output of `claude --version`.
      placeholder: "2.1.304 (Claude Code)"
    validations:
      required: true

  - type: input
    id: env
    attributes:
      label: OS and terminal
      placeholder: "macOS 27, Ghostty / Fedora 43, kitty"
    validations:
      required: true

  - type: textarea
    id: status
    attributes:
      label: Output of /litany
      render: text
    validations:
      required: false
